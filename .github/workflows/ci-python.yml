# CI commune des dépôts Python (kinetix-backend, kinetix-vision).
# Chaque dépôt l'appelle avec un petit fichier .github/workflows/ci.yml.
name: CI Python commune

on:
  workflow_call:
    inputs:
      installation:
        description: "Commande pour installer les dépendances avant les tests"
        type: string
        default: "pip install pytest"
      hooks-a-sauter:
        description: "Hooks pre-commit à ne pas lancer en CI (séparés par des virgules)"
        type: string
        default: ""

jobs:
  verifications:
    name: Vérifications (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: ${{ inputs.hooks-a-sauter }}

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"
      - name: Installer les dépendances
        run: ${{ inputs.installation }}
      - name: Lancer les tests
        # Code 5 = "aucun test trouvé" : normal tant que le dépôt est vide, on ne bloque pas.
        run: pytest || [ $? -eq 5 ]
